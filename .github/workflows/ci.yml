name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The console consumes substrate as a LIBRARY, through its public surfaces only. CI mirrors the
# documented local run model: check out both repos side by side, install substrate editable into a
# venv, and run the console's checks against it. laffeyp/substrate is public, so the checkout needs
# no token. (The workflow used to prefer a CROSS_REPO_TOKEN secret; that PAT expired and every
# checkout failed with "Bad credentials" while the default token would have worked.)
#
# UI sprint 106 (2026-10-07): every run had failed since at least 2026-09-28. The e2e job called
# four npm scripts deleted with the classic tree on 2026-09-22; the lint job ran an unpinned
# `uvx ruff`, whose newer default rules reported 231 errors the project's pinned ruff does not; the
# two checkout jobs failed on an expired CROSS_REPO_TOKEN, unneeded for a public repo. The jobs below
# run the checks that exist.

jobs:
  lint:
    name: lint (ruff, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Pinned to the ruff in substrate's uv.lock, which the local `uv run --project ../substrate
      # ruff check .` uses (Twelve-Factor II: declare dependencies exactly). ruff.toml excludes
      # _deprecated/.
      - name: Ruff
        run: uvx ruff@0.15.17 check .

  server-tests:
    name: server tests (real substrate.api)
    runs-on: ubuntu-latest
    steps:
      - name: Check out substrate-ui
        uses: actions/checkout@v5
        with:
          path: substrate-ui
      - name: Check out substrate (the library the console consumes)
        uses: actions/checkout@v5
        with:
          repository: laffeyp/substrate
          path: substrate
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install substrate (editable, with dev extras)
        working-directory: substrate
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev]"
      # tests/conftest.py gives the run a fresh SUBSTRATE_HOME and generates the demo records.
      - name: substrate-ui tests
        working-directory: substrate
        run: uv run python -m pytest ../substrate-ui/tests -q

  web:
    name: web (generated kinds, build, client specs, vocabulary)
    runs-on: ubuntu-latest
    steps:
      - name: Check out substrate-ui
        uses: actions/checkout@v5
        with:
          path: substrate-ui
      - name: Check out substrate
        uses: actions/checkout@v5
        with:
          repository: laffeyp/substrate
          path: substrate
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install substrate (editable)
        working-directory: substrate
        run: |
          uv venv --python 3.14
          uv pip install -e .
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web deps (pinned by package-lock)
        working-directory: substrate-ui
        run: npm ci
      - name: Envelope kinds generated from the kernel are current
        working-directory: substrate-ui
        run: uv run --project ../substrate python scripts/gen_kinds.py --check
      - name: Build (tsc, eslint, vite)
        working-directory: substrate-ui
        run: npm run build
      - name: Client unit specs
        working-directory: substrate-ui
        run: npm run test:unit
      - name: Signal vocabulary parity
        working-directory: substrate-ui
        run: npx tsx web/vm/tools/check-vocabulary-parity.ts
