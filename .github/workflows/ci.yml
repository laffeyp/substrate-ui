name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The console consumes substrate as a LIBRARY, through its public surfaces only. CI mirrors the
# documented local run model: check out both repos side by side, install substrate editable into a
# venv, and run the console's tests against it (cd substrate && uv run python ../substrate-ui/...).
# The substrate checkout uses the default token (fine for a public repo); if laffeyp/Substrate is
# private, set a repo secret CROSS_REPO_TOKEN to a PAT with read access and it is used instead.

jobs:
  lint:
    name: lint (ruff, backend Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # static lint only (no substrate needed) on the backend Python the console ships. Format is
      # deliberately NOT gated here -- the UI Python isn't ruff-formatted and that's its own style.
      - name: Ruff
        run: uvx ruff check server.py builder.py demo_topologies.py gen_demo_records.py tests/

  server-tests:
    name: server tests (real substrate.api over HTTP)
    runs-on: ubuntu-latest
    steps:
      - name: Check out substrate-ui
        uses: actions/checkout@v5
        with:
          path: substrate-ui
      - name: Check out substrate (the library the console consumes)
        uses: actions/checkout@v5
        with:
          repository: laffeyp/Substrate
          path: substrate
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install substrate (editable, with dev extras)
        working-directory: substrate
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Generate the demo fixture records (some tests read them)
        working-directory: substrate
        run: uv run python ../substrate-ui/gen_demo_records.py
      - name: Server tests (real server on an ephemeral port, real substrate.api)
        working-directory: substrate
        run: uv run python -m pytest ../substrate-ui/tests/test_server.py -q

  e2e:
    name: e2e (structural DOM, real Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Check out substrate-ui
        uses: actions/checkout@v5
        with:
          path: substrate-ui
      - name: Check out substrate
        uses: actions/checkout@v5
        with:
          repository: laffeyp/Substrate
          path: substrate
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install substrate (editable)
        working-directory: substrate
        run: |
          uv venv --python 3.12
          uv pip install -e .
      - name: Generate the demo fixture records (the e2e reads them)
        working-directory: substrate
        run: uv run python ../substrate-ui/gen_demo_records.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install harness deps + Chrome (pinned by package-lock)
        working-directory: substrate-ui
        run: |
          npm ci
          npx playwright install chrome --with-deps
      - name: Run the console + Studio e2e (server in the background)
        working-directory: substrate
        run: |
          uv run python ../substrate-ui/server.py &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ >/dev/null 2>&1 && break
            sleep 1
          done
          cd ../substrate-ui
          npm run e2e
          npm run e2e:studio
